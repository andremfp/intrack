name: CI

on:
  pull_request:
    branches: [staging, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_LOCAL_SUPABASE_URL: ${{ secrets.VITE_LOCAL_SUPABASE_URL }}
      VITE_LOCAL_SUPABASE_SECRET: ${{ secrets.VITE_LOCAL_SUPABASE_SECRET }}
      # We also map the standard VITE_ var to the local one so tests verify against local
      VITE_SUPABASE_URL: ${{ secrets.VITE_LOCAL_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_LOCAL_SUPABASE_ANON_KEY }}
      # Cloudflare's public always-pass Turnstile test key, so the login captcha
      # solves itself in e2e (local Supabase has captcha disabled). Baked in at build.
      VITE_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
    steps:
      - name: Enforce Staging -> Main Flow
        if: github.base_ref == 'main' && github.head_ref != 'staging'
        run: |
          echo "Error: Direct PRs to main are not allowed. You must merge to 'staging' first."
          echo "Current flow: ${{ github.head_ref }} -> ${{ github.base_ref }}"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # origin/main and all tags, for the version check

      - name: Check Version Bump (on PR to Main)
        if: github.base_ref == 'main'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BASE=$(git show origin/main:package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")

          # Must be strictly newer than what main already has.
          if [ "$VERSION" = "$BASE" ] || \
             [ "$(printf '%s\n%s\n' "$BASE" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "❌ Error: version $VERSION is not newer than $BASE on main."
            echo "Bump it on staging: npm version patch|minor|major --no-git-tag-version"
            exit 1
          fi

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "❌ Error: tag v$VERSION already exists. Use a version that has not been released."
            exit 1
          fi

          echo "✅ v$VERSION is newer than v$BASE and not yet released."

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build app
        run: npm run build

      - uses: supabase/setup-cli@d239d1052f6f024a8d746d7e5aeddead63b9cb53 # v3.1.0
        with:
          version: "2.113.0"

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.7.7"

      - name: Start Local Supabase
        run: |
          npm run sb:local:start
          npm run sb:local:db:seed:users

      - name: Deploy Functions
        run: npm run sb:local:functions:deploy

      - name: Verify Types
        run: npm run sb:local:generate:schema && git diff --exit-code src/schema.ts

      - name: Run Tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Smoke Tests
        run: npm run test:e2e
