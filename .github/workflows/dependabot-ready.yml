name: Dependabot ready

# Labels a Dependabot PR `ready-to-merge` once every check is green and pings the
# owner once. Runs from the default branch after CI, so it can write to the PR
# without ever checking out or executing the PR's code.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write

# One run per PR branch at a time, so two finishing CI runs cannot double-ping.
concurrency:
  group: dependabot-ready-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  label:
    name: Label ready Dependabot PRs
    if: >-
      ${{ github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.actor.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Sync the ready-to-merge label with the PR's checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          OWNER: ${{ github.repository_owner }}
          LABEL: ready-to-merge
        run: |
          if [ -z "$PR" ]; then
            echo "No pull request on this run; nothing to label."
            exit 0
          fi

          # Ready = mergeable and every check finished green (skipped is fine).
          # A pending or failed check, or a conflict, means not ready.
          STATE=$(gh pr view "$PR" --json mergeable,statusCheckRollup --jq '
            if .mergeable == "CONFLICTING" then "not-ready"
            elif ([.statusCheckRollup[] | (.conclusion // .state // "PENDING")]
                  | all(. == "SUCCESS" or . == "SKIPPED" or . == "NEUTRAL")) then "ready"
            else "not-ready" end')
          HAS=$(gh pr view "$PR" --json labels --jq "[.labels[].name] | index(\"$LABEL\") != null")
          echo "PR #$PR is $STATE (label present: $HAS)"

          if [ "$STATE" = "ready" ] && [ "$HAS" = "false" ]; then
            gh label create "$LABEL" --color 0E8A16 \
              --description "Dependabot PR with green checks, waiting for a human merge" 2>/dev/null || true
            gh pr edit "$PR" --add-label "$LABEL"
            gh pr comment "$PR" --body "@$OWNER all checks are green; ready to merge."
          elif [ "$STATE" = "not-ready" ] && [ "$HAS" = "true" ]; then
            gh pr edit "$PR" --remove-label "$LABEL"
          fi
