version: 2
updates:
  # ───────────────── npm ─────────────────
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "staging" # ride the staging → main → prod pipeline
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    ignore:
      # Added 2026-08-09. typescript-eslint 8.x peers typescript ">=4.8.4 <6.1.0",
      # so TS 7 breaks `npm ci` (PR #169: lockfile desync + unresolved
      # @typescript/typescript-* platform binaries).
      # REMOVE WHEN: `npm view typescript-eslint peerDependencies.typescript`
      # allows 7. typescript-eslint ships inside the grouped "eslint" PR.
      - dependency-name: "typescript"
        versions: [">=7"]
      # Added 2026-11-04. @types/node's major must equal the runtime major in
      # package.json `engines` / .nvmrc (tests/config/node-version.test.ts).
      # REMOVE WHEN: bumping Node to 27; raise this floor together with
      # engines, .nvmrc and @types/node.
      - dependency-name: "@types/node"
        versions: [">=27"]
    labels:
      - "⚙️ Dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # Families that must move together get their own group (majors included).
    # Order matters: a dependency joins the first group that matches it.
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vite:
        patterns: ["vite", "@vitejs/*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*", "tw-animate-css"]
      eslint:
        patterns: ["eslint", "eslint-*", "@eslint/*", "typescript-eslint"]
      # Everything else: one PR for minor and patch; majors open one PR each.
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ───────────── github-actions ─────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "⚙️ Dependencies"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"] # one PR for all action bumps
