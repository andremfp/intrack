version: 2
updates:
  # ───────────────── npm ─────────────────
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "staging" # ride the staging → main → prod pipeline
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    ignore:
      # Added 2026-08-09. typescript-eslint 8.x peers typescript ">=4.8.4 <6.1.0",
      # so TS 7 breaks `npm ci` (PR #169: lockfile desync + unresolved
      # @typescript/typescript-* platform binaries).
      # REMOVE WHEN: `npm view typescript-eslint peerDependencies.typescript`
      # allows 7. Watch the grouped "eslint" dependabot PR — typescript-eslint
      # ships inside it, it will not open its own PR.
      - dependency-name: "typescript"
        versions: [">=7"]
    labels:
      - "⚙️ Dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      react:
        patterns: ["react", "react-dom", "react-router-dom"]
      radix:
        patterns: ["@radix-ui/*"]
      dnd-kit:
        patterns: ["@dnd-kit/*"]
      tanstack:
        patterns: ["@tanstack/*"]
      supabase:
        patterns: ["@supabase/*", "supabase"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*", "tw-animate-css"]
      vite:
        patterns: ["vite", "@vitejs/*"]
      eslint:
        patterns: ["eslint", "eslint-*", "@eslint/*", "typescript-eslint"]
      testing:
        patterns:
          - "vitest"
          - "@testing-library/*"
          - "@playwright/test"
          - "jsdom"
      typescript:
        patterns: ["typescript", "@types/*"]
      excel:
        patterns: ["read-excel-file", "write-excel-file"]

  # ───────────── github-actions ─────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "⚙️ Dependencies"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"] # one PR for all action bumps
